name: Release

# Builds every platform when a version tag (v1.2.3) is pushed, and attaches the
# downloads to that GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP: HarshPaint
  BIN: harshpaint
  CLI: harshpaint-cli
  BUNDLE_ID: io.github.hvpathak.harshpaint
  DESKTOP_CATEGORIES: "Graphics;2DGraphics;RasterGraphics;"
  DESKTOP_MIME: "image/png;image/jpeg;image/bmp;image/gif;"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target/release/$env:BIN.exe" "dist/$env:APP-windows-x64.exe"
          Copy-Item "target/release/$env:CLI.exe" "dist/$env:CLI-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    # Built on an older Ubuntu so the binary runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="$APP-linux-x64"
          mkdir -p "dist/$name"
          cp "target/release/$BIN" "target/release/$CLI" "dist/$name/"
          cp assets/icon-256.png "dist/$name/$BIN.png"
          printf '%s\n' \
            "[Desktop Entry]" \
            "Type=Application" \
            "Name=$APP" \
            "Exec=$BIN %f" \
            "Icon=$BIN" \
            "Categories=$DESKTOP_CATEGORIES" \
            "MimeType=$DESKTOP_MIME" \
            "Terminal=false" > "dist/$name/$BIN.desktop"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  macos:
    # One universal app: runs natively on Apple Silicon and Intel Macs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal -t aarch64-apple-darwin -t x86_64-apple-darwin && rustup default stable
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package
        run: |
          app="dist/$APP.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/$APP" \
            "target/aarch64-apple-darwin/release/$BIN" "target/x86_64-apple-darwin/release/$BIN"
          lipo -create -output "dist/$CLI" \
            "target/aarch64-apple-darwin/release/$CLI" "target/x86_64-apple-darwin/release/$CLI"
          lipo -info "$app/Contents/MacOS/$APP"

          icon=assets/icon-512.png
          [ -f "$icon" ] || icon=assets/icon-256.png
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s "$icon" --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
          done
          for s in 16 32 128 256; do
            d=$((s * 2))
            sips -z $d $d "$icon" --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/$APP.icns"

          version="${GITHUB_REF_NAME#v}"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>$APP</string>
            <key>CFBundleDisplayName</key><string>$APP</string>
            <key>CFBundleIdentifier</key><string>$BUNDLE_ID</string>
            <key>CFBundleExecutable</key><string>$APP</string>
            <key>CFBundleIconFile</key><string>$APP</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature: required for Apple Silicon to run the app at all.
          codesign --force --deep --sign - "$app"
          cd dist
          ditto -c -k --keepParent "$APP.app" "$APP-macos-universal.zip"
          zip -j "$CLI-macos-universal.zip" "$CLI"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$APP ${GITHUB_REF_NAME}" --notes "Downloads for Windows, Linux and macOS."
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
